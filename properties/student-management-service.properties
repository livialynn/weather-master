#server.port={cipher}{key:mykey}

server.port=8080

spring.application.name=student-management-service
# MariaDB connection URL
spring.datasource.url=jdbc:mariadb://localhost:3306/student_db

# Database username
spring.datasource.username={cipher}{key:mykey}

# Database password(did not set password for this database for the student management service before)
spring.datasource.password=

spring.docker.compose.enabled=false

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

#actuator endpoint
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

logging.file.name=logs/student.log
logging.level.root=INFO
